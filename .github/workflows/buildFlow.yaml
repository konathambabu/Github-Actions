name: build workflow
on: [push,workflow_dispatch]
jobs:
  build-Job:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: print msg
        run: echo "test code"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: my-artifact
          path: dist/
  display:
    needs: build-Job
    runs-on: ubuntu-latest
    steps:
      - name: Get Bild Artifacts
        uses: actions/download-artifact@v8
        with:
          name: my-artifact
      - name: output content
        run: ls
      - name: Deploy
        run: echo "Deploy..."
      
